<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Describe a token - {{.Title}} - simple-ca</title>
    <script src="{{.Script}}"></script>
    {{template "theme" .Theme}}
  </head>
  <body class="min-h-screen bg-page text-ink">
    <div class="mx-auto max-w-3xl px-4 py-10 sm:py-16 xl:w-3/4 xl:max-w-[120rem] 2xl:w-2/3">
      <div class="overflow-hidden rounded-2xl border border-line bg-card shadow-lg">
        <div class="bg-head px-6 py-4 text-head-ink">
          <h1 class="text-xl font-semibold">Describe a token</h1>
          <p class="mt-1 text-sm text-head-muted">{{.Title}}, served by simple-ca</p>
        </div>
        <form method="post" action="{{.Action}}" class="space-y-5 px-6 py-5">
          {{- if .Error}}
          <p class="rounded-lg border border-bad-line bg-bad px-4 py-3 text-sm text-bad-ink">{{.Error}}</p>
          {{- end}}
          {{- if .Attributes}}
          <p class="text-sm">A token of the {{.CA}}:</p>
          <dl class="grid grid-cols-[max-content_1fr] gap-x-4 gap-y-1 text-sm">
            {{- range .Attributes}}
            <dt class="text-muted">{{index . 0}}</dt>
            <dd class="break-all">{{index . 1}}</dd>
            {{- end}}
          </dl>
          {{- end}}
          <div class="space-y-1">
            <label for="token" class="block text-sm font-medium">Token</label>
            <textarea id="token" name="token" rows="6" required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
              class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono text-xs"></textarea>
          </div>
          <div class="flex flex-wrap items-center justify-end gap-2">
            <button type="button" data-cancel class="rounded-lg border border-field-line px-4 py-2 text-sm font-medium hover:bg-subtle">Cancel</button>
            <button type="submit" class="rounded-lg bg-action px-4 py-2 text-sm font-semibold text-action-ink shadow-sm hover:bg-action-hover">Describe</button>
          </div>
        </form>
      </div>
      {{template "version"}}
    </div>
    <script src="/assets/webui/picker.js"></script>
  </body>
</html>
