<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signing in - {{.Title}} - simple-ca</title>
    <script src="{{.Script}}"></script>
    {{template "theme" .Theme}}
  </head>
  <body class="min-h-screen bg-page text-ink">
    <div class="mx-auto max-w-3xl px-4 py-10 sm:py-16 xl:w-3/4 xl:max-w-[120rem] 2xl:w-2/3">
      <div class="overflow-hidden rounded-2xl border border-line bg-card shadow-lg">
        <div class="bg-head px-6 py-4 text-head-ink">
          <h1 class="text-xl font-semibold">Signing in</h1>
          <p class="mt-1 text-sm text-head-muted">{{.Title}}, served by simple-ca</p>
        </div>
        <div id="oidc-callback" class="space-y-4 px-6 py-5">
          <p id="oidc-message" class="text-sm">Getting your token...</p>
          <div id="oidc-question" class="hidden flex-wrap items-center justify-end gap-2">
            <button id="oidc-cancel" type="button" class="rounded-lg border border-field-line px-4 py-2 text-sm font-medium hover:bg-subtle">Cancel</button>
            <button id="oidc-reuse" type="button" class="hidden rounded-lg border border-field-line px-4 py-2 text-sm font-medium hover:bg-subtle">Use the current token</button>
            <button id="oidc-replace" type="button" class="rounded-lg bg-action px-4 py-2 text-sm font-semibold text-action-ink shadow-sm hover:bg-action-hover">Replace it</button>
          </div>
          <a id="oidc-back" class="hidden text-sm text-link hover:underline" href="/">Back</a>
        </div>
      </div>
      {{template "version"}}
    </div>
    <script src="/assets/webui/oidc.js"></script>
  </body>
</html>
