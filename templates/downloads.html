<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Downloads - {{.Title}} - simple-ca</title>
    <script src="{{.Script}}"></script>
    {{template "theme" .Theme}}
  </head>
  <body class="min-h-screen bg-page text-ink">
    <div class="mx-auto max-w-5xl px-4 py-10 sm:py-16 xl:w-11/12 xl:max-w-[160rem] 2xl:w-5/6">
      <div class="overflow-hidden rounded-2xl border border-line bg-card shadow-lg">
        <div class="bg-head px-6 py-4 text-head-ink">
          <h1 class="text-xl font-semibold">Downloads</h1>
          <p class="mt-1 text-sm text-head-muted">{{.Title}}, served by simple-ca</p>
          <div class="mt-2 flex flex-wrap gap-4">
            <a class="text-sm text-head-link hover:underline" href="/">All CAs</a>
          </div>
        </div>
        <div class="px-6 py-5">
          {{- if .Files}}
          <table class="w-full text-left text-sm">
            <thead class="text-muted">
              <tr>
                <th class="py-1 pr-3 font-medium">File</th>
                <th class="py-1 pr-3 font-medium">Size</th>
                <th class="py-1 font-medium">SHA-256</th>
              </tr>
            </thead>
            <tbody>
              {{- range .Files}}
              <tr class="border-t border-line">
                <td class="py-2 pr-3 font-medium whitespace-nowrap"><a class="hover:underline" href="{{$.Path}}{{.Name}}">{{.Name}}</a></td>
                <td class="py-2 pr-3 whitespace-nowrap">{{.Size}}</td>
                <td class="py-2 font-mono text-xs break-all">
                  <span class="inline-flex items-center gap-1.5"><a class="hover:underline" href="{{$.Path}}{{.Name}}.sha256">{{.SHA256}}</a>
                  <button type="button" data-copy="{{.SHA256}}" title="Copy the SHA-256" aria-label="Copy the SHA-256" class="shrink-0 rounded p-1 text-muted hover:bg-subtle hover:text-ink"></button></span>
                </td>
              </tr>
              {{- end}}
            </tbody>
          </table>
          {{- else}}
          <p class="text-sm text-muted">No files are offered.</p>
          {{- end}}
        </div>
      </div>
      {{template "version"}}
    </div>
    <script src="/assets/webui/copy.js"></script>
  </body>
</html>
