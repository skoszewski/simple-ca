<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secrets - simple-ca</title>
    {{template "theme" ""}}
    <style id="ca-theme"></style>
  </head>
  <body class="min-h-screen bg-page text-ink">
    <div class="mx-auto max-w-5xl space-y-6 px-4 py-10 sm:py-16 xl:w-11/12 xl:max-w-[160rem] 2xl:w-5/6">
      <div class="rounded-2xl border border-line bg-card shadow-lg">
        {{template "webui-top" "Secrets"}}
        <main id="ca-section" class="space-y-4 px-6 py-5"></main>
      </div>
      {{template "version"}}
    </div>

    {{template "webui-dialogs"}}

    <dialog id="create-dialog" class="m-auto w-[calc(100%-2rem)] max-w-2xl rounded-2xl border border-line bg-card p-0 text-ink shadow-lg backdrop:bg-black/50">
      <form id="create-form" class="grid grid-cols-1 gap-4 px-6 py-5 text-sm sm:grid-cols-2">
        <h2 id="create-title" class="text-lg font-semibold sm:col-span-2">Create a secret</h2>
        <p id="create-error" class="hidden rounded-lg border border-bad-line bg-bad px-4 py-3 text-bad-ink sm:col-span-2"></p>
        <label class="space-y-1"><span class="block font-medium">Name</span>
          <input name="name" required placeholder="db-password" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
        <label class="space-y-1"><span class="block font-medium">Code valid for</span>
          <input name="valid" required placeholder="30, 8h, 7d" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
        <label class="space-y-1 sm:col-span-2"><span class="block font-medium">Secret</span>
          <textarea name="secret" required rows="5" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></textarea></label>
        <label class="space-y-1 sm:col-span-2"><span class="block font-medium">Code usable from</span>
          <input name="networks" placeholder="192.168.1.4, 192.168.1.0/24" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
        <div class="flex justify-end gap-2 sm:col-span-2">
          <button id="create-cancel" type="button" class="rounded-lg border border-field-line px-4 py-2 font-medium hover:bg-subtle">Cancel</button>
          <button type="submit" class="rounded-lg bg-action px-4 py-2 font-semibold text-action-ink shadow-sm hover:bg-action-hover">Create</button>
        </div>
      </form>
    </dialog>

    <script src="/assets/webui/picker.js"></script>
    <script src="/assets/webui/oidc.js"></script>
    <script src="/assets/webui/login.js"></script>
    <script src="/assets/webui/webui.js"></script>
    <script src="/assets/webui/secrets.js"></script>
  </body>
</html>
