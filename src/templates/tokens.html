<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tokens - simple-ca</title>
    <script src="{{.Script}}"></script>
    {{template "theme" ""}}
    <style id="ca-theme"></style>
  </head>
  <body class="min-h-screen bg-page text-ink">
    <div class="mx-auto max-w-5xl space-y-6 px-4 py-10 sm:py-16 xl:w-11/12 xl:max-w-[160rem] 2xl:w-5/6">
      <div class="rounded-2xl border border-line bg-card shadow-lg">
        {{template "webui-top" "Tokens"}}
        <main id="ca-section" class="space-y-4 px-6 py-5"></main>
      </div>
      {{template "version"}}
    </div>

    {{template "webui-dialogs"}}

    <dialog id="create-dialog" class="m-auto w-full max-w-2xl rounded-2xl border border-line bg-card p-0 text-ink shadow-lg backdrop:bg-black/50">
      <form id="create-form" class="grid grid-cols-1 gap-4 px-6 py-5 text-sm sm:grid-cols-2">
        <h2 id="create-title" class="text-lg font-semibold sm:col-span-2">Create a token</h2>
        <p id="create-error" class="hidden rounded-lg border border-bad-line bg-bad px-4 py-3 text-bad-ink sm:col-span-2"></p>
        <label class="space-y-1"><span class="block font-medium">Name</span>
          <input name="name" required placeholder="web-deploy" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
        <label class="space-y-1"><span class="block font-medium">Valid for</span>
          <input name="valid" required placeholder="30, 8h, 180d, 1y" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
        <div class="space-y-1"><span id="create-scopes-label" class="block font-medium">Scopes</span>
          <div id="create-scopes"></div>
        </div>
        <label class="space-y-1"><span class="block font-medium">Allowed clients</span>
          <input name="clients" placeholder="192.168.1.4, 192.168.1.0/24" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
        <fieldset id="sign-fields" class="contents">
          <h3 class="border-t border-line pt-3 font-semibold sm:col-span-2">Signing</h3>
          <label class="space-y-1"><span class="block font-medium">Allowed domains</span>
            <input name="domains" placeholder="example.com, lab.example.org" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
          <label class="space-y-1"><span class="block font-medium">Allowed IP addresses</span>
            <input name="ips" placeholder="192.0.2.10, 10.0.0.0/8" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
          <div class="space-y-1"><span id="create-types-label" class="block font-medium">Certificate types</span>
            <div id="create-types"></div>
          </div>
          <label class="flex items-center gap-1.5 sm:pt-6"><input type="checkbox" name="localhost"> Allow localhost and 127.0.0.1</label>
        </fieldset>
        <fieldset id="federate-fields" class="contents">
          <h3 class="border-t border-line pt-3 font-semibold sm:col-span-2">Federation</h3>
          <div class="space-y-1"><span id="create-federate-label" class="block font-medium">Token type</span>
            <div id="create-federate"></div>
          </div>
          <label id="federate-audience" class="space-y-1"><span class="block font-medium">Audience</span>
            <input name="audience" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
          <label id="federate-claims" class="space-y-1 sm:col-span-2"><span class="block font-medium">Claims, one name=value a line</span>
            <textarea name="claims" rows="2" placeholder="env=prod" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></textarea></label>
        </fieldset>
        <label class="flex items-center gap-1.5 border-t border-line pt-3 sm:col-span-2"><input type="checkbox" name="otc"> One-time setup code</label>
        <fieldset id="otc-fields" class="contents">
          <label class="space-y-1"><span class="block font-medium">Code valid for</span>
            <input name="otc_valid" placeholder="15, 1h" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
          <label class="space-y-1"><span class="block font-medium">Code usable from</span>
            <input name="otc_networks" placeholder="192.168.1.0/24" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full rounded-lg border border-field-line bg-field px-3 py-2 font-mono"></label>
        </fieldset>
        <div class="flex justify-end gap-2 sm:col-span-2">
          <button id="create-cancel" type="button" class="rounded-lg border border-field-line px-4 py-2 font-medium hover:bg-subtle">Cancel</button>
          <button type="submit" class="rounded-lg bg-action px-4 py-2 font-semibold text-action-ink shadow-sm hover:bg-action-hover">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="json-dialog" class="m-auto w-full max-w-2xl rounded-2xl border border-line bg-card p-0 text-ink shadow-lg backdrop:bg-black/50">
      <form method="dialog" class="space-y-4 px-6 py-5">
        <h2 id="json-title" class="text-lg font-semibold"></h2>
        <pre id="json-text" class="max-h-[60vh] overflow-auto rounded-lg border border-line bg-field px-3 py-2 font-mono text-xs"></pre>
        <div class="flex justify-end">
          <button value="close" class="rounded-lg border border-field-line px-4 py-2 text-sm font-medium hover:bg-subtle">Close</button>
        </div>
      </form>
    </dialog>

    <dialog id="federate-dialog" class="m-auto w-full max-w-2xl rounded-2xl border border-line bg-card p-0 text-ink shadow-lg backdrop:bg-black/50">
      <form method="dialog" class="space-y-4 px-6 py-5">
        <h2 id="federate-title" class="text-lg font-semibold"></h2>
        <dl id="federate-attributes" class="grid grid-cols-[max-content_1fr] gap-x-4 gap-y-1 text-sm"></dl>
        <div class="flex justify-end">
          <button value="close" class="rounded-lg border border-field-line px-4 py-2 text-sm font-medium hover:bg-subtle">Close</button>
        </div>
      </form>
    </dialog>

    <script src="/assets/webui/picker.js"></script>
    <script src="/assets/webui/oidc.js"></script>
    <script src="/assets/webui/login.js"></script>
    <script src="/assets/webui/webui.js"></script>
    <script src="/assets/webui/tokens.js"></script>
  </body>
</html>
