# Publishes a GitHub release for a pushed tag vX.Y.Z or vX.Y.Z-PRE; a tag vX.Y.Z-N is not built.
#
# - check: gofmt and go vet.
# - build: for each platform, simple-ca, request-cert, token-setup, request-token, simple-ca-wif
#   and simple-ca-trust, versioned with the tag, in one archive,
#   simple-ca-X.Y.Z-<goos>-<goarch>.tar.gz, .zip for Windows, and simple-ca-lite in its own,
#   simple-ca-lite-X.Y.Z-<goos>-<goarch>.tar.gz, .zip for Windows.
# - deb: the Debian packages of ./build.mjs deb for amd64 and arm64, each on a runner of its
#   architecture, simple-ca_X.Y.Z-1_<arch>.deb and simple-ca-lite_X.Y.Z-1_<arch>.deb.
# - release: refuses a tag that is not semver, not on main, or not the newest CHANGELOG.md entry;
#   creates the release with the archives and the packages, and the tag's message as notes, a
#   prerelease for -PRE.

name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "!v[0-9]+.[0-9]+.[0-9]+-[0-9]+"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Fails when a Go file is not gofmt clean.
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'these files are not gofmt clean:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      # Runs go vet on every package.
      - name: Vet
        run: go vet ./...

  build:
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-latest }
          - { platform: darwin/amd64, runner: xcode-27 }
          - { platform: darwin/arm64, runner: xcode-27 }
          - { platform: windows/amd64, runner: ubuntu-latest }
          - { platform: windows/arm64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - if: startsWith(matrix.platform, 'windows/')
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Downloads the browser files of serve-markdown's page, which simple-ca embeds.
      - name: Page assets
        run: node build.mjs assets
      # Builds the six programs for the platform and packs them into its archive, and simple-ca-lite
      # into its own, from directories in the temporary directory of the runner.
      - name: Build
        id: build
        env:
          CGO_ENABLED: "0"
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
          InformationalVersion: ${{ github.ref_name }}
        run: |
          export GOOS="${PLATFORM%%/*}" GOARCH="${PLATFORM##*/}"
          exe=""
          if [ "$GOOS" = "windows" ]; then
            exe=".exe"
          fi
          version="${TAG#v}"
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/pack-lite" dist
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "$RUNNER_TEMP/pack/simple-ca$exe" .
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "$RUNNER_TEMP/pack/request-cert$exe" ./cmd/request-cert
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "$RUNNER_TEMP/pack/token-setup$exe" ./cmd/token-setup
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "$RUNNER_TEMP/pack/request-token$exe" ./cmd/request-token
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "$RUNNER_TEMP/pack/simple-ca-wif$exe" ./cmd/simple-ca-wif
          # simple-ca-trust is the Go program on Linux, the Swift one on macOS, the .NET one on Windows.
          case "$GOOS" in
            linux)
              go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "$RUNNER_TEMP/pack/simple-ca-trust" ./cmd/simple-ca-trust
              ;;
            darwin)
              printf '/// The version simple-ca-trust prints; a release build replaces this file.\nlet version = "%s"\n' "$TAG" \
                > trust/macos/Sources/simple-ca-trust/Version.swift
              node build.mjs trust "darwin/$GOARCH"
              cp "bin/simple-ca-trust-darwin-$GOARCH" "$RUNNER_TEMP/pack/simple-ca-trust"
              ;;
            windows)
              node build.mjs trust "windows/$GOARCH"
              cp "bin/simple-ca-trust-windows-$GOARCH.exe" "$RUNNER_TEMP/pack/simple-ca-trust.exe"
              ;;
          esac
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "$RUNNER_TEMP/pack-lite/simple-ca-lite$exe" ./cmd/simple-ca-lite
          if [ "$GOOS" = "windows" ]; then
            archive="simple-ca-$version-$GOOS-$GOARCH.zip"
            lite_archive="simple-ca-lite-$version-$GOOS-$GOARCH.zip"
            (cd "$RUNNER_TEMP/pack" &&zip -9 "$GITHUB_WORKSPACE/dist/$archive" *)
            (cd "$RUNNER_TEMP/pack-lite" &&zip -9 "$GITHUB_WORKSPACE/dist/$lite_archive" *)
          else
            archive="simple-ca-$version-$GOOS-$GOARCH.tar.gz"
            lite_archive="simple-ca-lite-$version-$GOOS-$GOARCH.tar.gz"
            (cd "$RUNNER_TEMP/pack" &&tar -czf "$GITHUB_WORKSPACE/dist/$archive" *)
            (cd "$RUNNER_TEMP/pack-lite" &&tar -czf "$GITHUB_WORKSPACE/dist/$lite_archive" *)
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "lite_archive=$lite_archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.lite_archive }}
          archive: false
          if-no-files-found: error

  deb:
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      # The whole history with its tags, so build.mjs finds the tag of the newest entry.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # A docker-container builder, which writes the package with --output type=local.
      - uses: docker/setup-buildx-action@v4
      # Builds the packages in Docker for the architecture of the runner.
      - name: Debian packages
        id: deb
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          node build.mjs deb
          package="$(cd dist && ls "simple-ca_"*"_$ARCH.deb")"
          lite_package="$(cd dist && ls "simple-ca-lite_"*"_$ARCH.deb")"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "lite_package=$lite_package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.deb.outputs.package }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.deb.outputs.lite_package }}
          archive: false
          if-no-files-found: error

  release:
    needs: [build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Fails for a tag that is not semver with a leading v.
      - name: Semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          semver="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "'$TAG' is not a semver tag with a leading v" >&2
            exit 1
          fi
      # Fails for a tag whose commit is not on main.
      - name: Tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "'$TAG' is not on main" >&2
            exit 1
          fi
      # Fails for a tag that is not the version of the newest CHANGELOG.md entry.
      - name: Tag of the newest CHANGELOG.md entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          newest="$(awk '/^## / { print $2; exit }' CHANGELOG.md)"
          if [ "v$newest" != "$TAG" ]; then
            echo "'$TAG' is not the version of the newest CHANGELOG.md entry, '$newest'" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true
      # Creates the release with the archives and the packages, a prerelease for a tag with a -PRE
      # part.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-from-tag "${prerelease[@]}"
