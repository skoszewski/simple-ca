# A semver tag with a leading v on a commit on main, naming the newest CHANGELOG.md entry, is
# checked for formatting and by go vet, built for every platform it is published for, and published
# as a release, with the tag's message as its notes and as a prerelease for a prerelease version.
# A tag vX.Y.Z-N, a later release of the same code with changes to the documentation or the
# packaging alone, is not built.
# simple-ca, request-cert and token-setup are given the tag as their version and published together in a
# tar.gz, or a zip for Windows, named after the version, without the v, and the platform.
# simple-ca embeds the browser files of serve-markdown's page for its /help/ page, which build.mjs
# downloads from the serve-markdown release go.mod names. simple-ca-trust is built by build.mjs for macOS with Swift on the Xcode 27
# image and for Windows with .NET, running on the installed .NET runtime, and published the same
# way as simple-ca-trust-<version>-<platform>.

name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "!v[0-9]+.[0-9]+.[0-9]+-[0-9]+"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'these files are not gofmt clean:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Page assets
        run: node build.mjs assets
      - name: Build
        id: build
        env:
          CGO_ENABLED: "0"
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
        run: |
          export GOOS="${PLATFORM%%/*}" GOARCH="${PLATFORM##*/}"
          exe=""
          if [ "$GOOS" = "windows" ]; then
            exe=".exe"
          fi
          version="${TAG#v}"
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "build/simple-ca$exe" .
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "build/request-cert$exe" ./cmd/request-cert
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "build/token-setup$exe" ./cmd/token-setup
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            archive="simple-ca-$version-$GOOS-$GOARCH.zip"
            (cd build && zip -9 "../dist/$archive" "simple-ca$exe" "request-cert$exe" "token-setup$exe")
          else
            archive="simple-ca-$version-$GOOS-$GOARCH.tar.gz"
            tar -czf "dist/$archive" -C build "simple-ca$exe" "request-cert$exe" "token-setup$exe"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error

  trust-macos:
    needs: check
    runs-on: xcode-27
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Swift
        run: swift --version
      - name: Build
        id: build
        env:
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '/// The version simple-ca-trust prints; a release build replaces this file.\nlet version = "%s"\n' "$TAG" \
            > trust/macos/Sources/simple-ca-trust/Version.swift
          node build.mjs trust "darwin/$GOARCH"
          mkdir -p build dist
          cp "simple-ca-trust-darwin-$GOARCH" build/simple-ca-trust
          archive="simple-ca-trust-${TAG#v}-darwin-$GOARCH.tar.gz"
          tar -czf "dist/$archive" -C build simple-ca-trust
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error

  trust-windows:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        id: build
        env:
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
          InformationalVersion: ${{ github.ref_name }}
        run: |
          node build.mjs trust "windows/$GOARCH"
          mkdir -p build dist
          cp "simple-ca-trust-windows-$GOARCH.exe" build/simple-ca-trust.exe
          archive="simple-ca-trust-${TAG#v}-windows-$GOARCH.zip"
          (cd build && zip -9 "../dist/$archive" simple-ca-trust.exe)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error

  release:
    needs: [build, trust-macos, trust-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          semver="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "'$TAG' is not a semver tag with a leading v" >&2
            exit 1
          fi
      - name: Tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "'$TAG' is not on main" >&2
            exit 1
          fi
      - name: Tag of the newest CHANGELOG.md entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          newest="$(awk '/^## / { print $2; exit }' CHANGELOG.md)"
          if [ "v$newest" != "$TAG" ]; then
            echo "'$TAG' is not the version of the newest CHANGELOG.md entry, '$newest'" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-from-tag "${prerelease[@]}"
