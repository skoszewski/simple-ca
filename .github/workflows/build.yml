# Publishes a GitHub release for a pushed tag vX.Y.Z or vX.Y.Z-PRE; a tag vX.Y.Z-N is not built.
#
# - check: gofmt and go vet.
# - build: for each platform, simple-ca, request-cert, token-setup, request-token and
#   simple-ca-trust, versioned with the tag, in one archive, simple-ca-X.Y.Z-<goos>-<goarch>.tar.gz,
#   .zip for Windows.
# - release: refuses a tag that is not semver, not on main, or not the newest CHANGELOG.md entry;
#   creates the release with the archives and the tag's message as notes, a prerelease for -PRE.

name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "!v[0-9]+.[0-9]+.[0-9]+-[0-9]+"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Fails when a Go file is not gofmt clean.
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'these files are not gofmt clean:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      # Runs go vet on every package.
      - name: Vet
        run: go vet ./...

  build:
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-latest }
          - { platform: darwin/amd64, runner: xcode-27 }
          - { platform: darwin/arm64, runner: xcode-27 }
          - { platform: windows/amd64, runner: ubuntu-latest }
          - { platform: windows/arm64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - if: startsWith(matrix.platform, 'windows/')
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Downloads the browser files of serve-markdown's page, which simple-ca embeds.
      - name: Page assets
        run: node build.mjs assets
      # Builds the five programs for the platform and packs them into its archive.
      - name: Build
        id: build
        env:
          CGO_ENABLED: "0"
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
          InformationalVersion: ${{ github.ref_name }}
        run: |
          export GOOS="${PLATFORM%%/*}" GOARCH="${PLATFORM##*/}"
          exe=""
          if [ "$GOOS" = "windows" ]; then
            exe=".exe"
          fi
          version="${TAG#v}"
          mkdir -p bin/pack dist
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "bin/pack/simple-ca$exe" .
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "bin/pack/request-cert$exe" ./cmd/request-cert
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "bin/pack/token-setup$exe" ./cmd/token-setup
          go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o "bin/pack/request-token$exe" ./cmd/request-token
          # simple-ca-trust is the Go program on Linux, the Swift one on macOS, the .NET one on Windows.
          case "$GOOS" in
            linux)
              go build -trimpath -ldflags "-X main.buildVersion=$TAG" -o bin/pack/simple-ca-trust ./cmd/simple-ca-trust
              ;;
            darwin)
              printf '/// The version simple-ca-trust prints; a release build replaces this file.\nlet version = "%s"\n' "$TAG" \
                > trust/macos/Sources/simple-ca-trust/Version.swift
              node build.mjs trust "darwin/$GOARCH"
              cp "bin/simple-ca-trust-darwin-$GOARCH" bin/pack/simple-ca-trust
              ;;
            windows)
              node build.mjs trust "windows/$GOARCH"
              cp "bin/simple-ca-trust-windows-$GOARCH.exe" bin/pack/simple-ca-trust.exe
              ;;
          esac
          if [ "$GOOS" = "windows" ]; then
            archive="simple-ca-$version-$GOOS-$GOARCH.zip"
            (cd bin/pack && zip -9 "../../dist/$archive" *)
          else
            archive="simple-ca-$version-$GOOS-$GOARCH.tar.gz"
            (cd bin/pack && tar -czf "../../dist/$archive" *)
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Fails for a tag that is not semver with a leading v.
      - name: Semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          semver="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "'$TAG' is not a semver tag with a leading v" >&2
            exit 1
          fi
      # Fails for a tag whose commit is not on main.
      - name: Tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "'$TAG' is not on main" >&2
            exit 1
          fi
      # Fails for a tag that is not the version of the newest CHANGELOG.md entry.
      - name: Tag of the newest CHANGELOG.md entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          newest="$(awk '/^## / { print $2; exit }' CHANGELOG.md)"
          if [ "v$newest" != "$TAG" ]; then
            echo "'$TAG' is not the version of the newest CHANGELOG.md entry, '$newest'" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true
      # Creates the release with the archives, a prerelease for a tag with a -PRE part.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-from-tag "${prerelease[@]}"
